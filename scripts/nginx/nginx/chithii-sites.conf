# Chithii app — every site nginx serves (replaces /etc/caddy/Caddyfile, Nov 2026).
# Customer addresses added later in the Platform get their own file in /etc/nginx/chithii-customers/,
# written by /usr/local/sbin/chithii-domain-certs (the replacement for Caddy's on-demand TLS).

# ---- Plain HTTP -------------------------------------------------------------------------------------
# Any other hostname reaches the app over HTTP, so a new customer address can be verified before it
# has a certificate (what Caddy's `http://` block did). ACME challenges are answered for every name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include snippets/chithii-acme.conf;
    location / { include snippets/chithii-proxy.conf; }
}

# Names with a certificate: HTTP -> HTTPS (308 keeps the method and body, as Caddy did).
server {
    listen 80;
    listen [::]:80;
    server_name app.chithii.com admin.chithii.com noorvip.chithii.com
                zoventio.udboy.com admin.udboy.com
                demo.getassist.pro admin.getassist.pro noorvip.getassist.pro;
    include snippets/chithii-acme.conf;
    location / { return 308 https://$host$request_uri; }
}

# ---- HTTPS: unknown names are refused at the handshake --------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# ---- HTTPS: the app -----------------------------------------------------------------------------------
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name app.chithii.com;
    ssl_certificate     /etc/letsencrypt/live/app.chithii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.chithii.com/privkey.pem;
    location / { include snippets/chithii-proxy.conf; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name admin.chithii.com;
    ssl_certificate     /etc/letsencrypt/live/admin.chithii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.chithii.com/privkey.pem;
    location / { include snippets/chithii-proxy.conf; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name noorvip.chithii.com;
    ssl_certificate     /etc/letsencrypt/live/noorvip.chithii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noorvip.chithii.com/privkey.pem;
    location / { include snippets/chithii-proxy.conf; }
}

# Older addresses not on getassist.pro: unchanged, still served as before.
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name zoventio.udboy.com;
    ssl_certificate     /etc/letsencrypt/live/zoventio.udboy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoventio.udboy.com/privkey.pem;
    location / { include snippets/chithii-proxy.conf; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name admin.udboy.com;
    ssl_certificate     /etc/letsencrypt/live/admin.udboy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.udboy.com/privkey.pem;
    location / { include snippets/chithii-proxy.conf; }
}

# ---- HTTPS: getassist.pro (expiring) -> chithii.com -----------------------------------------------
# Pages get a permanent redirect. Machine traffic keeps reaching the app until every provider points
# at the new address, because a redirect drops a POST body: webhooks and OAuth/payment callbacks
# (/api/...), project APIs (/p/<project>/api/...) and the website-chat widget (/c/<key>).
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name demo.getassist.pro;
    ssl_certificate     /etc/letsencrypt/live/demo.getassist.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.getassist.pro/privkey.pem;
    location /api/            { include snippets/chithii-proxy.conf; }
    location /c/              { include snippets/chithii-proxy.conf; }
    location ~ ^/p/[^/]+/api/ { include snippets/chithii-proxy.conf; }
    location /                { return 301 https://app.chithii.com$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name admin.getassist.pro;
    ssl_certificate     /etc/letsencrypt/live/admin.getassist.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.getassist.pro/privkey.pem;
    location /api/            { include snippets/chithii-proxy.conf; }
    location /c/              { include snippets/chithii-proxy.conf; }
    location ~ ^/p/[^/]+/api/ { include snippets/chithii-proxy.conf; }
    location /                { return 301 https://admin.chithii.com$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name noorvip.getassist.pro;
    ssl_certificate     /etc/letsencrypt/live/noorvip.getassist.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noorvip.getassist.pro/privkey.pem;
    location /api/            { include snippets/chithii-proxy.conf; }
    location /c/              { include snippets/chithii-proxy.conf; }
    location ~ ^/p/[^/]+/api/ { include snippets/chithii-proxy.conf; }
    location /                { return 301 https://noorvip.chithii.com$request_uri; }
}

include /etc/nginx/chithii-customers/*.conf;
