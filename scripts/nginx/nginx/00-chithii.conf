# Chithii — shared http{} settings. (gzip on, ssl_protocols and ssl_prefer_server_ciphers are already
# set in Ubuntu's nginx.conf; repeating them here would be a duplicate-directive error.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream chithii_app {
    server 127.0.0.1:8668;
    keepalive 32;
}

# server_tokens is set to off in nginx.conf by 01-prepare.sh (Ubuntu already sets it there).

# Chat file uploads (photos, documents, voice notes). Caddy had no limit; the app enforces its own.
client_max_body_size 100m;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml application/rss+xml application/manifest+json image/svg+xml;

ssl_session_cache shared:chithii_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
