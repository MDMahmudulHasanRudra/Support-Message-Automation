# Proxy to the Next.js app. Security headers (HSTS, X-Frame-Options, CSP, ...) come from the app itself
# (apps/web/next.config.ts); HSTS is sent only when X-Forwarded-Proto is https.
proxy_pass http://chithii_app;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwritten, never appended: the app's sign-in rate limit trusts the FIRST entry (authRateLimit.ts),
# exactly as it did behind Caddy.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Websockets, and long-lived live updates (the inbox stream is SSE and sends X-Accel-Buffering: no).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
