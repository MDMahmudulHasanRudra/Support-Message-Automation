<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083138">
<title>You are offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #083138; color: #fff; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 20px; color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.5; }
  button { height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #fff; color: #083138; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Customer messages are still being collected. Reconnect to see them.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
