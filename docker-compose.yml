# ┌──────────────────────────────────────────────────────────────────────────────────────────────┐
# │ DEPLOYING? RUN THE MIGRATIONS FIRST — see DEPLOY.md.                                         │
# │                                                                                              │
# │   docker compose run --rm migrate          # every deploy, before restarting app or worker  │
# │                                                                                              │
# │ `docker compose up -d --no-deps app` / `… worker` does NOT run them: --no-deps skips the     │
# │ `migrate` service `app` depends on. New code on an unmigrated database fails with P2022 and  │
# │ the worker can stop storing messages.                                                        │
# └──────────────────────────────────────────────────────────────────────────────────────────────┘
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Stated rather than inherited. 100 is already the image's default, but the connection budget
    # is now a number both sides are sized against — `packages/db` bounds each process's Prisma
    # pool (see withPoolBounds) precisely so `app` + `worker` + a migration + a psql session stay
    # comfortably inside this. Leaving it implicit meant the ceiling lived only in Postgres's
    # documentation while the clients scaled themselves off the host's core count.
    command:
      - postgres
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No `ports:` on purpose: Postgres must never be reachable from outside the
    # Docker host (VPS public IP) in production — `app`/`worker`/`migrate` all
    # reach it over automation_net using the `postgres` service name, which
    # works with no published port. Use `docker compose exec postgres psql ...`
    # for local inspection instead of connecting from the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - automation_net

  # One-shot: applies every packages/db/prisma/migrations/* migration, in order, then seeds the
  # initial admin user + safe defaults (both idempotent — safe to run on every `docker compose
  # up`, not just the first). Reuses the worker's already-built image (it's the only one whose
  # runtime stage keeps the Prisma CLI + packages/db/prisma around — see apps/web/Dockerfile's
  # runtime stage, which trims those away for a lean Next.js image) rather than adding a fourth
  # Dockerfile. Required so a fresh clone on a new machine doesn't start `app`/`worker` against an
  # empty, unmigrated, admin-less database — see README.md.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
    working_dir: /app/packages/db
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    networks:
      - automation_net

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Dhaka}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # SaaS emergency switch (SAAS_PLATFORM_PLAN.md §8): "true" forces hostname routing OFF whatever
      # the Domains page says — every address behaves as before. Set in .env, then recreate the app.
      SAAS_HOST_ROUTING_DISABLED: ${SAAS_HOST_ROUTING_DISABLED:-}
      # WhatsApp profile pictures, emergency stop (WHATSAPP_AVATARS.md): "true" serves no picture, whatever any project says.
      WHATSAPP_AVATARS_DISABLED: ${WHATSAPP_AVATARS_DISABLED:-}
      AI_CREDENTIALS_ENCRYPTION_KEY: ${AI_CREDENTIALS_ENCRYPTION_KEY}
      # Softify Forge — product knowledge from the ISPDIGITAL repository. Both apps read these:
      # the worker to do the reading, the dashboard for its settings page. Unset means the
      # integration is simply absent, which is the documented default (see FORGE_SETUP.md).
      FORGE_API_KEY: ${FORGE_API_KEY}
      FORGE_API_URL: ${FORGE_API_URL}
      # WhatsApp media files (MEDIA_STORAGE.md). The dashboard only READS them — through an
      # authorised endpoint, never a public URL — from the same volume the worker writes to.
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/app/media}
      # Google Sheets (GOOGLE_SHEETS.md): the server's own OAuth client. Unset = not set up yet.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Connect with Facebook — the platform's Meta app (docs/meta-integration/META_DEVELOPER_SETUP.md).
      # Off unless META_INTEGRATION_ENABLED=true. The worker needs the secret too (appsecret_proof).
      META_INTEGRATION_ENABLED: ${META_INTEGRATION_ENABLED:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
    volumes:
      - whatsapp_media:/app/media
    ports:
      - "${WEB_PORT:-8668}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - automation_net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Dhaka}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      WHATSAPP_SESSION_DIR: ${WHATSAPP_SESSION_DIR:-/app/sessions}
      WHATSAPP_SESSION_NAME: ${WHATSAPP_SESSION_NAME:-support-automation}
      WHATSAPP_USE_STEALTH: ${WHATSAPP_USE_STEALTH:-true}
      WHATSAPP_CUSTOM_USER_AGENT: ${WHATSAPP_CUSTOM_USER_AGENT}
      WHATSAPP_GROUP_SYNC_TIMEOUT_MS: ${WHATSAPP_GROUP_SYNC_TIMEOUT_MS:-150000}
      # Two diagnostics, both off by default and both for the same class of problem: a session that
      # looks healthy while nothing arrives. WHATSAPP_DEBUG_BROWSER turns on the library's own
      # console/screenshot capture; WHATSAPP_DEBUG_EVENTS prints every event it raises, which is how
      # you tell "WhatsApp said nothing" from "we stopped listening". The browser one was already
      # read by the provider and simply never passed through here, so it could not be switched on
      # in the deployment it exists for.
      # Connect timeouts. Both are OVERRIDES and deliberately default to empty, so the worker's own
      # constants apply: they are only correct relative to each other and to the library's timers
      # (connectTimeouts.test.ts), and a number written here would silently win over them. A
      # default of 300000 here once made the no-code deadline equal to the linking window in every
      # Docker deployment while the test — which reads the source — still passed.
      #   WHATSAPP_CONNECT_WATCHDOG_MS    the linking window the dialog counts down (code: 5 min)
      #   WHATSAPP_FIRST_CODE_TIMEOUT_MS  no code at all by then -> retry (code: 4 min, must be less)
      WHATSAPP_CONNECT_WATCHDOG_MS: ${WHATSAPP_CONNECT_WATCHDOG_MS:-}
      WHATSAPP_FIRST_CODE_TIMEOUT_MS: ${WHATSAPP_FIRST_CODE_TIMEOUT_MS:-}
      WHATSAPP_DEBUG_BROWSER: ${WHATSAPP_DEBUG_BROWSER:-false}
      WHATSAPP_DEBUG_EVENTS: ${WHATSAPP_DEBUG_EVENTS:-false}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      WHATSAPP_NOTIFICATION_GROUP_ID: ${WHATSAPP_NOTIFICATION_GROUP_ID}
      # Needed by packages/ai-client's resolveAiClient() to decrypt a stored AiProvider API key
      # before calling it — same key apps/web already uses, so the two must always match.
      AI_CREDENTIALS_ENCRYPTION_KEY: ${AI_CREDENTIALS_ENCRYPTION_KEY}
      # Softify Forge — the worker does the reading (see FORGE_SETUP.md). Unset means the
      # integration is absent, and both Forge loops return immediately every tick.
      FORGE_API_KEY: ${FORGE_API_KEY}
      FORGE_API_URL: ${FORGE_API_URL}
      # Seeds an AiProvider + model config on boot so a deployment is usable without opening the
      # dashboard. Never overwrites a provider an admin already configured.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      # SaaS billing emails (reminders, owner invitations). Empty = nothing is emailed; the in-app notice still shows.
      PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
      PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
      PLATFORM_SMTP_TLS: ${PLATFORM_SMTP_TLS:-}
      PLATFORM_SMTP_USER: ${PLATFORM_SMTP_USER:-}
      PLATFORM_SMTP_PASSWORD: ${PLATFORM_SMTP_PASSWORD:-}
      PLATFORM_SMTP_FROM_ADDRESS: ${PLATFORM_SMTP_FROM_ADDRESS:-}
      PLATFORM_SMTP_FROM_NAME: ${PLATFORM_SMTP_FROM_NAME:-}
      # WhatsApp profile pictures, emergency stop (WHATSAPP_AVATARS.md): "true" records and fetches nothing.
      WHATSAPP_AVATARS_DISABLED: ${WHATSAPP_AVATARS_DISABLED:-}
      # WhatsApp media files (MEDIA_STORAGE.md): downloaded here in the background, kept on the
      # whatsapp_media volume shared with the dashboard. Below MEDIA_MIN_FREE_DISK_MB of free space
      # nothing new is written — this disk is shared with Postgres, and a full disk stops it too.
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/app/media}
      MEDIA_MIN_FREE_DISK_MB: ${MEDIA_MIN_FREE_DISK_MB:-2048}
      MEDIA_DOWNLOAD_CONCURRENCY: ${MEDIA_DOWNLOAD_CONCURRENCY:-2}
      # Google Sheets (GOOGLE_SHEETS.md, Phase 8): the worker refreshes a connected account's access
      # to read changes made in Google directly. The same OAuth client as the app. Unset = nothing runs.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Connect with Facebook — the platform's Meta app (docs/meta-integration/META_DEVELOPER_SETUP.md).
      # Off unless META_INTEGRATION_ENABLED=true. The worker needs the secret too (appsecret_proof).
      META_INTEGRATION_ENABLED: ${META_INTEGRATION_ENABLED:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
    # No `ports:` here on purpose: the worker's health endpoint binds to
    # 127.0.0.1 inside the container only, for its own HEALTHCHECK to use.
    # The dashboard never talks to the worker over HTTP (see ARCHITECTURE.md).
    volumes:
      - whatsapp_session:/app/sessions
      - whatsapp_media:/app/media
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - automation_net

volumes:
  pg_data:
    name: support_automation_pg_data
  whatsapp_session:
    name: support_automation_whatsapp_session
  # WhatsApp media files. NOT covered by a database backup — back this volume up separately.
  whatsapp_media:
    name: support_automation_media

networks:
  automation_net:
    driver: bridge
